fullnameOverride: "dashboard"

image:
  repository: registry.iprogrammer.uz/botspace/dashboard
  tag: "de552aa"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: iprogrammer-registry

replicaCount: 1

service:
  enabled: true
  type: NodePort
  port: 3010
  targetPort: 3010
  nodePort: 30010

configMaps:
  config:
    NODE_ENV: "production"
    PORT: "3010"
    NEXT_PUBLIC_API_URL: "https://api.botspace.uz/api"
    NEXT_PUBLIC_AGENT_URL: "https://api.botspace.uz/api/agent"
    NEXT_PUBLIC_CONSTRUCTOR_URL: "https://botspace.uz/constructor"
    NEXT_PUBLIC_SITE_URL: "https://botspace.uz"
    NEXT_PUBLIC_TELEGRAM_BOT: "botmother_authbot"
    NEXT_PUBLIC_DEFAULT_LOCALE: "uz"
    SESSION_COOKIE_NAME: "bm_session"

envFrom:
  - secretRef:
      name: dashboard-secret

probes:
  startup:
    enabled: true
    type: tcpSocket
    tcpSocket:
      port: 3010
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  readiness:
    enabled: true
    type: tcpSocket
    tcpSocket:
      port: 3010
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    type: tcpSocket
    tcpSocket:
      port: 3010
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - base
