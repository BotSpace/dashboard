name: Build and Push Docker Image (tag + latest)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - '*.md'

env:
  # Harbor project / image name → registry.irpgrammer.uz/botspace/dashboard
  PROJECT_NAME: botspace/dashboard

permissions:
  contents: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Next.js bakes NEXT_PUBLIC_* into the static bundle at build time, so
      # they must exist as env vars during `npm run build` inside the Docker
      # image. We materialise them in `.env.production` which Next.js auto-loads.
      - name: Write build-time env
        run: |
          cat > .env.production <<EOF
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.botmother.uz' }}
          NEXT_PUBLIC_AGENT_URL=${{ vars.NEXT_PUBLIC_AGENT_URL || 'https://api.botmother.uz/api/agent' }}
          NEXT_PUBLIC_CONSTRUCTOR_URL=${{ vars.NEXT_PUBLIC_CONSTRUCTOR_URL || 'https://botspace.uz/constructor' }}
          NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://botspace.uz' }}
          NEXT_PUBLIC_TELEGRAM_BOT=${{ vars.NEXT_PUBLIC_TELEGRAM_BOT || 'botmother_authbot' }}
          NEXT_PUBLIC_DEFAULT_LOCALE=${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE || 'uz' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          SESSION_COOKIE_NAME=bm_session
          # SESSION_SECRET / HANDOVER_SECRET are runtime-only — injected by
          # the Kubernetes Secret, never baked into the image.
          SESSION_SECRET=build-time-placeholder-not-used-at-runtime
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:${{ env.SHORT_SHA }}
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:latest

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ env.SHORT_SHA }}\"|" helm/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git diff --cached --quiet || git commit -m "deploy: update image tag to ${{ env.SHORT_SHA }}"
          git push origin main
